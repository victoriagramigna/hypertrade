name: Recorrido de Fuerza Relativa (reconstruir)

# Aparte, no toca el radar ni la Auditoria. Se corre SOLO a mano:
# pestaña Actions -> "Recorrido de Fuerza Relativa (reconstruir)" -> Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Reconstruir
        run: python scripts/rs_backfill.py
      - name: Guardar
        run: |
          git config user.name "radar-bot"
          git config user.email "actions@github.com"
          git add data/rs_score_historial_largo.jsonl
          git diff --staged --quiet || git commit -m "Recorrido de Fuerza Relativa reconstruido [skip ci]"
          git pull --rebase
          git push
