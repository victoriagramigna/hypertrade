name: Cuadrante de ETFs contra el SPY

# Aparte del radar (no toca el ranking ni la Auditoria). Corre despues del cierre de Wall Street
# (lunes a viernes) y se puede disparar a mano desde Actions -> Run workflow.
on:
  schedule:
    - cron: '40 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rs-spy-etfs
  cancel-in-progress: false

jobs:
  rs_spy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Correr
        run: python scripts/rs_spy_etfs.py
      - name: Guardar
        run: |
          git config user.name "radar-bot"
          git config user.email "actions@github.com"
          [ -f data/rs_spy_etfs.json ] && git add data/rs_spy_etfs.json
          git diff --staged --quiet || git commit -m "Cuadrante de ETFs contra el SPY [skip ci]"
          git pull --rebase
          git push
