name: Estudio Gap alcista 2 (anticipar)

# Estudio histórico aparte (no toca el radar ni la Auditoría). Se corre SOLO a mano:
# pestaña Actions -> "Estudio Gap alcista 2 (anticipar)" -> Run workflow. Tarda unos 15 minutos.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  estudio:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr el estudio
        run: python scripts/estudio_gap_previa.py

      - name: Guardar resultados
        run: |
          git config user.name "radar-bot"
          git config user.email "actions@github.com"
          git add data/estudio_gap_previa.json data/estudio_gap_previa_resumen.md
          git diff --staged --quiet || git commit -m "Estudio Gap alcista 2 (resultados) [skip ci]"
          # El radar también hace commits: se trae lo nuevo antes de subir
          git pull --rebase
          git push
