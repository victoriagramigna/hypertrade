name: Medias de 200 (SMA contra EMA)

# Aparte del radar (no toca el ranking ni la Auditoria). Corre despues del cierre de Wall Street, cuando el
# radar ya guardo los cierres del dia (data/cierres_diarios.jsonl), y se puede disparar a mano desde Actions.
on:
  schedule:
    - cron: '55 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: medias200
  cancel-in-progress: false

jobs:
  medias200:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Correr
        run: python scripts/medias200.py
      - name: Guardar
        run: |
          git config user.name "radar-bot"
          git config user.email "actions@github.com"
          for f in data/log_medias200.jsonl data/medias200_eval.json; do [ -f "$f" ] && git add "$f"; done
          git diff --staged --quiet || git commit -m "Medias de 200: SMA contra EMA [skip ci]"
          git pull --rebase
          git push
